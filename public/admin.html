<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Dispatch Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="adminGate" class="card auth-card">
      <h2>Admin Access</h2>
      <p class="muted">Admin password only.</p>
      <input type="password" id="adminPassword" placeholder="Admin password">
      <button onclick="unlockAdmin()">Unlock</button>
    </section>

    <section id="adminPanel" style="display:none;">
      <div class="card">
        <h2>Users Admin</h2>
        <p id="adminStatus" class="muted"></p>
        <div class="input-group">
          <input type="text" id="profileIdSearch" placeholder="Filter by profile UUID (optional)">
          <button onclick="loadProfiles()">Load Users</button>
        </div>
        <div class="input-group">
          <select id="profileSelect" onchange="selectProfileFromDropdown()">
            <option value="">Select a user</option>
          </select>
          <button onclick="saveSelectedProfile()">Save Selected User</button>
        </div>
      </div>
      <div class="card">
        <h3>Mass Apply to All Users</h3>
        <p class="muted">Fill only fields you want to apply. Leave blank to skip.</p>
        <label>Hours</label>
        <input id="mass_hours" type="number" min="1" step="1" placeholder="Leave blank to skip">
        <label>Jobs / Job Slots</label>
        <input id="mass_slots" type="number" min="1" step="1" placeholder="Leave blank to skip">
        <label>License(s)</label>
        <select id="mass_license">
          <option value="">Do not change</option>
          <option value="CPL">CPL</option>
          <option value="MPL">MPL</option>
          <option value="ATPL">ATPL</option>
        </select>
        <label>Position</label>
        <input id="mass_position" type="text" placeholder="Leave blank to skip">
        <label>Pay Multiplier</label>
        <input id="mass_multiplier" type="number" step="0.1" placeholder="Leave blank to skip">
        <label>Type Ratings (comma separated)</label>
        <input id="mass_ratings" type="text" placeholder="Leave blank to skip">
        <label>Money / Balance</label>
        <input id="mass_balance" type="number" min="1" step="1" placeholder="Leave blank to skip">
        <label>Employer</label>
        <input id="mass_employer" type="text" placeholder="Leave blank to skip">
        <label>Base Airport (ICAO format)</label>
        <input id="mass_base" type="text" maxlength="4" placeholder="Leave blank to skip">
        <label>Admin override refresh limit</label>
        <select id="mass_refreshOverride">
          <option value="">Do not change</option>
          <option value="true">Enabled</option>
          <option value="false">Disabled</option>
        </select>
        <label>Force 100% job acceptance chance</label>
        <select id="mass_acceptanceOverride">
          <option value="">Do not change</option>
          <option value="true">Enabled</option>
          <option value="false">Disabled</option>
        </select>
        <label>Enable SimBrief-only tracking start</label>
        <select id="mass_simbriefTrackingOverride">
          <option value="">Do not change</option>
          <option value="true">Enabled</option>
          <option value="false">Disabled</option>
        </select>
        <button onclick="massApplyProfiles()">Mass Apply to All Users</button>
      </div>
      <div class="card">
        <h2>CabinCue (Development)</h2>
        <p class="muted">Manage versioned airline announcement profiles, assets, and releases.</p>
        <div class="input-group">
          <select id="cabincueProfileSelect" onchange="selectCabinCueProfile()">
            <option value="">Select CabinCue profile</option>
          </select>
          <button onclick="loadCabinCueProfiles()">Reload CabinCue Profiles</button>
        </div>
        <div class="input-group">
          <input id="cabincueNewProfileName" type="text" placeholder="New profile display name (e.g., Emirates)">
          <button onclick="createCabinCueProfileFromGeneric()">Create from Generic Template</button>
        </div>
        <div class="input-group">
          <select id="cabincueVersionSelect" onchange="selectCabinCueVersion()">
            <option value="">Select profile version</option>
          </select>
          <button onclick="createCabinCueDraftVersion()">Create Draft Version</button>
          <button onclick="releaseCabinCueVersion()" class="success">Release Version</button>
          <button onclick="rollbackCabinCueVersion()" class="warning">Rollback to Selected Release</button>
        </div>
        <div class="input-group">
          <input id="cabincueReleaseNotes" type="text" placeholder="Release notes (optional)">
        </div>
        <p id="cabincueStatus" class="muted">CabinCue locked until admin access is unlocked.</p>
        <div id="cabincueEditor" class="list"></div>
        <h3>Release History</h3>
        <div id="cabincueReleaseHistory" class="list"></div>
      </div>
      <div id="profilesContainer" class="list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
  <script src="js/cabincue-admin.js"></script>
</body>
</html>
