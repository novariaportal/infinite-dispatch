<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Dispatch Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="adminGate" class="card auth-card">
      <h2>Admin Access</h2>
      <p class="muted">Profiles-only administration page.</p>
      <input type="password" id="adminPassword" placeholder="Admin password">
      <button onclick="unlockAdmin()">Unlock</button>
    </section>

    <section id="adminPanel" style="display:none;">
      <div class="card">
        <h2>Profiles Admin</h2>
        <p id="adminStatus" class="muted"></p>
        <div class="input-group">
          <input type="text" id="profileIdSearch" placeholder="Filter by profile UUID (optional)">
          <button onclick="loadProfiles()">Load Profiles</button>
        </div>
      </div>
      <div id="profilesContainer" class="list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
