<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CabinCue Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="cabincueAdminGate" class="card auth-card">
      <h2>CabinCue Admin Access</h2>
      <p class="muted">Enter admin password (<code>ifdispatchadmin</code>) and make sure you're signed in to Infinite Dispatch.</p>
      <input id="cabincueAdminPassword" type="password" placeholder="CabinCue admin password">
      <button onclick="unlockCabinCueAdmin()">Continue</button>
      <p id="cabincueAdminGateStatus" class="muted"></p>
    </section>

    <section id="cabincueAdminPanel" style="display:none;">
      <div class="card">
        <h2>CabinCue (Development)</h2>
        <p class="muted">Manage airline announcement profiles, assets, and titles.</p>
        <p id="cabincueAdminStatus" class="muted"></p>
        <div class="input-group">
          <select id="cabincueWorkflowMode" onchange="switchCabinCueWorkflowMode()">
            <option value="edit">Edit existing profile</option>
            <option value="create">Create new profile</option>
          </select>
        </div>
        <div id="cabincueExistingProfileGroup" class="input-group">
          <select id="cabincueProfileSelect" onchange="selectCabinCueProfile()">
            <option value="">Select CabinCue profile</option>
          </select>
          <button onclick="loadCabinCueProfiles()">Reload CabinCue Profiles</button>
        </div>
        <div id="cabincueCreateProfileGroup" class="input-group" style="display:none;">
          <input id="cabincueNewProfileName" type="text" placeholder="New profile display name (e.g., Emirates)">
          <button onclick="createCabinCueProfileFromGeneric()">Create from Generic Template</button>
        </div>
        <p id="cabincueStatus" class="muted">CabinCue locked until admin access is unlocked.</p>
        <div id="cabincueEditor" class="list"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="/js/cabincueadmin-page.js"></script>
  <script src="/js/cabincue-admin.js"></script>
</body>
</html>
